# Lints and formats the staged files before each commit, and stages the fixes. CI runs the
# same checks over the whole repository.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,mjs,ts,tsx}'
      run: ./node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: format
      glob: '*.{js,mjs,ts,tsx,json,css,md,yml}'
      run: ./node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # Whole-repository checks: an import or a removed export in one staged file can break
    # another file. Each takes about a second or less.
    - name: imports
      glob: '*.{ts,tsx}'
      run: bun run imports:check

    - name: icons
      glob: '*.{ts,tsx}'
      run: bun run icons:check

    - name: specs
      glob: '{docs/specs/*.md,*.test.ts,*.test.tsx,e2e/*.ts}'
      run: bun run specs:check

    - name: knip
      glob: '*.{js,mjs,ts,tsx,css,json}'
      run: bun run knip

    - name: datamodel
      glob: '{src/db/schema.ts,datamodel/*.ts}'
      run: bun run datamodel:check

    # Installed with Homebrew (README), needed only by commits that change a workflow.
    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: >-
        command -v actionlint > /dev/null || { echo 'actionlint is missing: brew install actionlint'; exit 1; };
        actionlint {staged_files}
