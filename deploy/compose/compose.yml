name: snowprofile
# Settings come from .env next to this file (.env.example lists them). `build` builds both
# images from this checkout; a deploy workflow, when one exists, publishes them instead.
services:
  app:
    image: ghcr.io/alrikp/snowprofile-app:${RELEASE:-local}
    build:
      context: ../..
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/snowprofile.db
      BETTER_AUTH_URL: https://${APP_HOST:?Set APP_HOST in .env}
      # Caddy sets this header from the client address it trusts (Caddyfile).
      CLIENT_IP_HEADER: cf-connecting-ip
      MIGRATE_ON_START: 'true'
    volumes:
      - app_data:/data
    expose:
      - '3000'
    healthcheck:
      # The image has no curl; Bun's fetch does the same.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  caddy:
    image: ghcr.io/alrikp/snowprofile-caddy:${RELEASE:-local}
    build:
      context: ../..
      target: caddy
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
    # Only Caddy publishes ports. HTTPS_PORT must match the port in APP_HOST, if it has one.
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  # The database. Never `docker compose down -v`: it deletes this volume. A demo stack and
  # the company stack use different names, so they never share a database.
  app_data:
    name: ${DATABASE_VOLUME:?Set DATABASE_VOLUME in .env}
  caddy_data:
  caddy_config:
