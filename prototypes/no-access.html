<!doctype html>
<html lang="et">
  <head>
    <title>No access · snowprofile prototype</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="build/prototype.css" />
    <script src="build/icons.js"></script>
    <script src="build/prototype.js"></script>
  </head>
  <body>
    <main class="flex min-h-svh flex-col items-center p-6 pt-12 md:justify-center md:p-10">
      <div class="flex w-full max-w-sm flex-col gap-6">
        <div class="flex items-center justify-between gap-4">
          <span class="flex items-center gap-2 font-semibold">
            <span class="flex size-6 items-center justify-center rounded-md bg-primary text-xs text-primary-foreground">sp</span>
            <span data-t="app_name"></span>
          </span>
          <div role="group" class="flex gap-1" data-t-label="language_label">
            <a data-locale="et" data-slot="button" data-size="sm" lang="et">Eesti</a>
            <a data-locale="en" data-slot="button" data-size="sm" lang="en">English</a>
          </div>
        </div>

        <div data-slot="card">
          <div data-slot="card-header">
            <h1 data-slot="card-title" class="text-xl" data-t="no_access_title"></h1>
            <p data-slot="card-description" data-t="no_access_body"></p>
          </div>
          <div data-slot="card-footer" class="flex-col items-start gap-4">
            <p
              class="text-sm text-muted-foreground"
              data-t="home_signed_in_as"
              data-t-params='{"name": "Mari Maasikas", "email": "mari.maasikas@example.com"}'
            ></p>
            <a href="sign-in.html" data-slot="button" data-variant="outline">
              <i data-icon="LogOutIcon"></i><span data-t="sign_out"></span>
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
