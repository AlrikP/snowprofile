<!doctype html>
<html lang="et">
  <head>
    <title>Import · snowprofile prototype</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="build/prototype.css" />
    <script src="build/icons.js"></script>
    <script src="build/prototype.js"></script>
  </head>
  <body data-frame="import" data-roles="admin" data-states="upload:Upload|preview:Preview|done:Imported with problems|clean:Imported cleanly|never:Never imported">
    <main class="flex flex-col gap-6 p-4 md:p-8">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div class="flex flex-col gap-1">
          <h1 class="text-3xl" data-t="import_title"></h1>
          <p class="max-w-3xl text-sm text-muted-foreground" data-t="import_description"></p>
        </div>
        
      </div>

      <section data-slot="card" class="max-w-4xl gap-4 py-5" aria-label="Upload" data-show-in="upload never">
        <form data-goto-state="preview" class="contents">
          <div data-slot="card-content" class="flex flex-col gap-4 px-5">
            <p class="text-sm text-muted-foreground" data-show-in="upload"><span data-t="import_last"></span>: <span data-date="2026-09-12"></span> · Anna Admin · Snowhound_CV_baas.xlsx</p>
            <p class="text-sm text-muted-foreground" data-show-in="never" data-t="import_never"></p>
            <div class="flex flex-col gap-2">
              <label data-slot="label" for="import-file" data-t="import_file"></label>
              <input data-slot="input" id="import-file" type="file" accept=".xlsx" class="h-auto py-1.5 file:mr-3 file:rounded file:bg-secondary file:px-3 file:py-1" />
            </div>
            <button type="submit" data-slot="button" class="w-fit"><i data-icon="FileCheckIcon"></i><span data-t="import_check"></span></button>
          </div>
        </form>
      </section>

      <section data-slot="card" class="max-w-4xl gap-4 py-5" aria-labelledby="preview-title" data-show-in="preview">
        <div data-slot="card-header" class="px-5">
          <h2 id="preview-title" class="text-xl" data-t="import_preview_title"></h2>
          <p data-slot="card-description">Snowhound_CV_baas.xlsx</p>
        </div>
        <div data-slot="card-content" class="flex flex-col gap-4 px-5">
          <div data-slot="table-container" class="rounded-md border">
            <table data-slot="table">
              <thead data-slot="table-header">
                <tr data-slot="table-row" class="hover:bg-transparent">
                  <td data-slot="table-head" class="px-4"></td>
                  <th data-slot="table-head" class="text-right" data-t="import_added"></th>
                  <th data-slot="table-head" class="text-right" data-t="import_updated"></th>
                  <th data-slot="table-head" class="pr-4 text-right" data-t="import_unchanged"></th>
                </tr>
              </thead>
              <tbody data-slot="table-body">
              <tr data-slot="table-row">
                <th data-slot="table-cell" scope="row" class="px-4 text-left font-medium" data-t="import_kind_projects"></th>
                <td data-slot="table-cell" class="text-right tabular-nums">3</td>
                <td data-slot="table-cell" class="text-right tabular-nums">18</td>
                <td data-slot="table-cell" class="pr-4 text-right tabular-nums text-muted-foreground">2</td>
              </tr>
              <tr data-slot="table-row">
                <th data-slot="table-cell" scope="row" class="px-4 text-left font-medium" data-t="import_kind_people"></th>
                <td data-slot="table-cell" class="text-right tabular-nums">1</td>
                <td data-slot="table-cell" class="text-right tabular-nums">9</td>
                <td data-slot="table-cell" class="pr-4 text-right tabular-nums text-muted-foreground">0</td>
              </tr>
              <tr data-slot="table-row">
                <th data-slot="table-cell" scope="row" class="px-4 text-left font-medium" data-t="import_kind_participations"></th>
                <td data-slot="table-cell" class="text-right tabular-nums">12</td>
                <td data-slot="table-cell" class="text-right tabular-nums">40</td>
                <td data-slot="table-cell" class="pr-4 text-right tabular-nums text-muted-foreground">31</td>
              </tr>
              <tr data-slot="table-row">
                <th data-slot="table-cell" scope="row" class="px-4 text-left font-medium" data-t="import_kind_technologies"></th>
                <td data-slot="table-cell" class="text-right tabular-nums">4</td>
                <td data-slot="table-cell" class="text-right tabular-nums">0</td>
                <td data-slot="table-cell" class="pr-4 text-right tabular-nums text-muted-foreground">58</td>
              </tr>
              </tbody>
            </table>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-slot="button" data-goto-state="done"><i data-icon="UploadIcon"></i><span data-t="import_apply"></span></button>
            <button type="button" data-slot="button" data-variant="outline" data-goto-state="upload" data-t="action_cancel"></button>
          </div>
        </div>
      </section>

      <div data-slot="alert" role="status" class="max-w-4xl" data-show-in="done clean">
        <i data-icon="CircleCheckBigIcon" class="text-emerald-700"></i>
        <div data-slot="alert-title" data-t="import_done_title"></div>
        <div data-slot="alert-description"><p><span data-date="2026-10-03"></span> · Snowhound_CV_baas.xlsx</p><p data-show-in="clean" data-t="import_clean"></p></div>
      </div>

        <section class="flex max-w-4xl flex-col gap-4" aria-labelledby="problems-title" data-show-in="preview done">
          <div class="flex flex-col gap-1">
            <h2 id="problems-title" class="text-2xl" data-t="import_problems_title" data-t-params='{"count": "7"}'></h2>
            <p class="text-sm text-muted-foreground" data-t="import_problems_body"></p>
          </div>
          <section class="flex flex-col gap-2" aria-labelledby="import_group_periods">
            <h3 id="import_group_periods" class="font-sans text-base font-semibold tracking-normal" data-t="import_group_periods"></h3>
            <div data-slot="card" class="gap-0 py-0">
              <div data-slot="table-container">
                <table data-slot="table" class="table-fixed">
                  <thead data-slot="table-header">
                    <tr data-slot="table-row" class="hover:bg-transparent">
                      <th data-slot="table-head" class="w-2/5 px-4 md:w-1/4" data-t="import_col_where"></th>
                      <th data-slot="table-head" class="md:w-1/4" data-t="import_col_value"></th>
                      <th data-slot="table-head" class="hidden md:table-cell" data-t="import_col_problem"></th>
                      <th data-slot="table-head" class="w-20 pr-4"><span class="sr-only" data-t="action_actions"></span></th>
                    </tr>
                  </thead>
                  <tbody data-slot="table-body">
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Projektid", "row": "14"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">juuni-okt 2024</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_period"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="project-edit.html?state=invalid-period" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Liis Lepp", "row": "6"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">kevad 2019</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_period"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="profile.html?state=participation" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
          <section class="flex flex-col gap-2" aria-labelledby="import_group_numbers">
            <h3 id="import_group_numbers" class="font-sans text-base font-semibold tracking-normal" data-t="import_group_numbers"></h3>
            <div data-slot="card" class="gap-0 py-0">
              <div data-slot="table-container">
                <table data-slot="table" class="table-fixed">
                  <thead data-slot="table-header">
                    <tr data-slot="table-row" class="hover:bg-transparent">
                      <th data-slot="table-head" class="w-2/5 px-4 md:w-1/4" data-t="import_col_where"></th>
                      <th data-slot="table-head" class="md:w-1/4" data-t="import_col_value"></th>
                      <th data-slot="table-head" class="hidden md:table-cell" data-t="import_col_problem"></th>
                      <th data-slot="table-head" class="w-20 pr-4"><span class="sr-only" data-t="action_actions"></span></th>
                    </tr>
                  </thead>
                  <tbody data-slot="table-body">
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Projektid", "row": "9"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">~3500-4000h</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_number"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="project-edit.html" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Projektid", "row": "21"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">palju</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_number"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="project-edit.html" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
          <section class="flex flex-col gap-2" aria-labelledby="import_group_references">
            <h3 id="import_group_references" class="font-sans text-base font-semibold tracking-normal" data-t="import_group_references"></h3>
            <div data-slot="card" class="gap-0 py-0">
              <div data-slot="table-container">
                <table data-slot="table" class="table-fixed">
                  <thead data-slot="table-header">
                    <tr data-slot="table-row" class="hover:bg-transparent">
                      <th data-slot="table-head" class="w-2/5 px-4 md:w-1/4" data-t="import_col_where"></th>
                      <th data-slot="table-head" class="md:w-1/4" data-t="import_col_value"></th>
                      <th data-slot="table-head" class="hidden md:table-cell" data-t="import_col_problem"></th>
                      <th data-slot="table-head" class="w-20 pr-4"><span class="sr-only" data-t="action_actions"></span></th>
                    </tr>
                  </thead>
                  <tbody data-slot="table-body">
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Peeter Puu", "row": "4"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">Projekt 19b</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_reference"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="profile.html?state=participation" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
          <section class="flex flex-col gap-2" aria-labelledby="import_group_technologies">
            <h3 id="import_group_technologies" class="font-sans text-base font-semibold tracking-normal" data-t="import_group_technologies"></h3>
            <div data-slot="card" class="gap-0 py-0">
              <div data-slot="table-container">
                <table data-slot="table" class="table-fixed">
                  <thead data-slot="table-header">
                    <tr data-slot="table-row" class="hover:bg-transparent">
                      <th data-slot="table-head" class="w-2/5 px-4 md:w-1/4" data-t="import_col_where"></th>
                      <th data-slot="table-head" class="md:w-1/4" data-t="import_col_value"></th>
                      <th data-slot="table-head" class="hidden md:table-cell" data-t="import_col_problem"></th>
                      <th data-slot="table-head" class="w-20 pr-4"><span class="sr-only" data-t="action_actions"></span></th>
                    </tr>
                  </thead>
                  <tbody data-slot="table-body">
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Kadri Kuusk", "row": "3"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">Postgre</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_technology"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="technologies.html?state=merge" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
          <section class="flex flex-col gap-2" aria-labelledby="import_group_criteria">
            <h3 id="import_group_criteria" class="font-sans text-base font-semibold tracking-normal" data-t="import_group_criteria"></h3>
            <div data-slot="card" class="gap-0 py-0">
              <div data-slot="table-container">
                <table data-slot="table" class="table-fixed">
                  <thead data-slot="table-header">
                    <tr data-slot="table-row" class="hover:bg-transparent">
                      <th data-slot="table-head" class="w-2/5 px-4 md:w-1/4" data-t="import_col_where"></th>
                      <th data-slot="table-head" class="md:w-1/4" data-t="import_col_value"></th>
                      <th data-slot="table-head" class="hidden md:table-cell" data-t="import_col_problem"></th>
                      <th data-slot="table-head" class="w-20 pr-4"><span class="sr-only" data-t="action_actions"></span></th>
                    </tr>
                  </thead>
                  <tbody data-slot="table-body">
                <tr data-slot="table-row">
                  <td data-slot="table-cell" class="px-4" data-t="import_row" data-t-params='{"sheet": "Projektid", "row": "7"}'></td>
                  <td data-slot="table-cell"><code class="rounded bg-muted px-1 font-mono break-words text-foreground">Mõlemad</code></td>
                  <td data-slot="table-cell" class="hidden md:table-cell" data-t="import_problem_criteria"></td>
                  <td data-slot="table-cell" class="pr-4 text-right"><a href="project-edit.html" data-slot="button" data-variant="ghost" data-size="sm" data-t="import_fix"></a></td>
                </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </section>
    </main>
  </body>
</html>
