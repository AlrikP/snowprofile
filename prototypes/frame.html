<!doctype html>
<html lang="et">
  <head>
    <title>App frame · snowprofile prototype</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="build/prototype.css" />
    <script src="build/icons.js"></script>
    <script src="build/prototype.js"></script>
  </head>
  <body data-frame="profile" data-states="request:Open update request|none:No request">
    <main class="flex flex-col gap-6 p-4 md:p-8">
      <h1 class="text-2xl font-semibold" data-t="nav_my_profile"></h1>
      <div data-slot="alert" role="status" data-show-in="request" class="max-w-2xl">
        <i data-icon="TriangleAlertIcon"></i>
        <div data-slot="alert-title" data-t="update_request_title"></div>
        <div data-slot="alert-description">
          <p data-t="update_request_body"></p>
          <button data-slot="button" data-size="sm" class="mt-2" data-t="update_request_confirm"></button>
        </div>
      </div>
      <p class="rounded-xl border border-dashed p-8 text-sm text-muted-foreground">
        The profile itself is in subtask 011.4.
      </p>
    </main>
  </body>
</html>
