# Checks every pull request and push to main. Later tasks add their checks as steps of the
# check job (AGENTS.md, "Running things").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the checks still running for the same pull request or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Lint, type check, and tests import the compiled messages in src/paraglide/.
      - name: Compile messages
        run: bun run i18n:compile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Applies every migration to a throwaway database and fails if src/db/schema.ts differs.
      - name: Schema drift
        run: bun run db:drift
