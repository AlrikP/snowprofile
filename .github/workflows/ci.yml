# Checks every pull request and push to main. Later tasks add their checks as steps of the
# check job (AGENTS.md, "Running things").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the checks still running for the same pull request or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Lint, type check, and tests import the compiled messages in src/paraglide/.
      - name: Compile messages
        run: bun run i18n:compile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Import areas
        run: bun run imports:check

      - name: Icon names
        run: bun run icons:check

      # Every scenario in docs/specs/ is cited by a test, and every cited ID exists.
      - name: Spec scenarios
        run: bun run specs:check

      - name: Type check
        run: bun run typecheck

      # Unused files, exports, and dependencies.
      - name: Knip
        run: bun run knip

      - name: Test
        run: bun run test

      # Applies every migration to a throwaway database and fails if src/db/schema.ts differs.
      - name: Schema drift
        run: bun run db:drift

      # Fails when datamodel/snowprofile.dbml isn't what schema.ts and notes.ts generate.
      - name: Data model diagram
        run: bun run datamodel:check

      # The production build, from the clean checkout CI has: it fails when a file the build
      # needs exists only in someone's working copy.
      - name: Build
        run: bun run build

      # Signs in the seeded users against the production build on a fresh database
      # (e2e/server.ts). Outside `test`, so that step needs no browser.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      # Builds both Dockerfile targets without pushing, so a broken image fails here. The
      # GitHub Actions cache is shared with the Compose deploy workflow; `load` keeps the app
      # image for the next step.
      - uses: docker/setup-buildx-action@v4

      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          load: true
          tags: snowprofile-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reuses the app build's stages.
      - name: Caddy image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: caddy
          cache-from: type=gha

      # Runs the app image on an empty volume as Compose does, then the bundled seeder with the
      # app stopped, then the app again on the seeded database. The e2e tests run scripts/*.ts
      # from source, so only this step runs the scripts the image starts with.
      - name: App image smoke test
        run: |
          settings=(
            -v snowprofile_ci_data:/data
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
            -e BETTER_AUTH_URL=http://localhost:3000
            -e DEMO_MODE=true
          )
          healthy() {
            for _ in $(seq 30); do
              curl -fs http://localhost:3000/api/health > /dev/null && return 0
              sleep 1
            done
            docker logs app
            return 1
          }
          docker run -d --name app -p 3000:3000 -e MIGRATE_ON_START=true "${settings[@]}" snowprofile-app:ci
          healthy
          docker stop app
          docker run --rm "${settings[@]}" snowprofile-app:ci \
            bun --no-env-file .output/server/scripts/db-seed.js
          docker start app
          healthy
